
name: Build RELIEF Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project archive
        run: |
          test -f RELIEF-Android-1.0.1-audit-update.zip

      - name: Extract RELIEF project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q RELIEF-Android-1.0.1-audit-update.zip -d extracted
          test -f extracted/RELIEF-Android/settings.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/RELIEF-Android" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-debug-apk
          path: extracted/RELIEF-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
